<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font-family:'Anek Malayalam','Noto Sans Malayalam',system-ui,sans-serif;color:var(--ink);background:var(--bg1);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;min-height:100vh;overflow-x:hidden}
.ar{font-family:var(--arf);direction:rtl}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--teal);color:#fff;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;box-shadow:0 4px 0 rgba(0,0,0,.18)}

header h1 small{display:block;font-size:.8rem;font-weight:500;opacity:.9}
.stars{background:var(--sun);color:#5a3b00;border-radius:20px;padding:3px 12px;font-weight:800;min-width:60px;text-align:center}
main{max-width:860px;margin:0 auto;padding:14px 14px 40px}
h2{margin:6px 0 12px;font-size:1.5rem}
.btn{border:0;border-radius:18px;padding:9px 18px;font:inherit;font-weight:700;color:#fff;background:var(--teal);box-shadow:0 5px 0 rgba(0,0,0,.22);cursor:pointer;transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn:focus-visible,.tile:focus-visible,.lt:focus-visible,.tab:focus-visible{outline:4px solid var(--sun);outline-offset:2px}
.btn.c{background:var(--coral)}.btn.v{background:var(--violet)}.btn.s{background:var(--sky)}.btn.g{background:var(--green)}
.hero{text-align:center;padding:10px 0 4px}
.hero .big{font-size:5rem;line-height:1.1;color:var(--teal);display:inline-block;animation:bob 3s ease-in-out infinite}
.hero p{margin:0;font-size:1.1rem}

.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:14px}
.tile{border:0;border-radius:26px;padding:18px 10px 14px;background:var(--c);color:#fff;font:inherit;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.25);transition:transform .12s;text-align:center}

.tile i{font-style:normal;font-size:3rem;display:block;filter:drop-shadow(0 4px 0 rgba(0,0,0,.2))}
.tile b{font-size:1.2rem;display:block}.tile span{font-size:.85rem;opacity:.92}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.lt{border:0;border-radius:18px;height:72px;font:700 2.8rem var(--arf);background:var(--card);color:var(--c);box-shadow:0 5px 0 var(--c);cursor:pointer;direction:rtl}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tab{border:0;border-radius:16px;padding:7px 14px;font:inherit;font-weight:700;background:var(--card);color:var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.15);cursor:pointer}
.tab.on{background:var(--violet);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--card);border-radius:22px;padding:12px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.14);cursor:pointer;border:0;font:inherit;color:var(--ink)}
.card:active{transform:scale(.96)}
.card .e{font-size:3.4rem;line-height:1.2}.card .a{font-size:2.2rem;line-height:1.3;color:var(--teal)}
.card .m{font-weight:700}.card .t{font-size:.85rem;opacity:.7}
.modal{position:fixed;inset:0;background:rgba(10,30,35,.6);display:flex;align-items:center;justify-content:center;padding:14px;z-index:20}
.panel{background:var(--card);border-radius:28px;padding:18px;max-width:430px;width:100%;max-height:92vh;overflow:auto;text-align:center;animation:pop .3s}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.panel .huge{font-size:7rem;line-height:1.2;color:var(--c)}
.forms{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
.forms div{background:var(--soft);border-radius:14px;padding:6px 2px}
.forms b{display:block;font:700 2.6rem var(--arf)}.forms small{font-size:.75rem}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.pad{position:relative;width:min(92vw,340px);aspect-ratio:1;margin:0 auto;background:var(--card);border-radius:26px;box-shadow:0 6px 0 rgba(0,0,0,.15);overflow:hidden}
.ghost{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:400 15rem var(--arf);color:var(--teal);opacity:.16;pointer-events:none;line-height:1}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.jw{background:var(--card);border-radius:22px;padding:12px;margin-bottom:14px;box-shadow:0 6px 0 rgba(0,0,0,.14);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.jw .e{font-size:3rem}.jw .body{flex:1;min-width:150px;text-align:center}
.split{font-size:2.4rem;color:var(--coral)}.whole{font-size:3.4rem;color:var(--teal);display:none}
.jw.on .split{display:none}.jw.on .whole{display:block;animation:pop .4s}
.chat{display:flex;flex-direction:column;gap:12px}
.bub{max-width:88%;border-radius:22px;padding:10px 16px;cursor:pointer;border:0;font:inherit;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.2);text-align:center}
.bub.A{align-self:flex-start;background:var(--sky)}.bub.B{align-self:flex-end;background:var(--green)}
.bub .a{font-size:2rem;line-height:1.4;display:block}.bub .m{font-size:.95rem;opacity:.95}
.q{text-align:center}.q .e{font-size:6rem;line-height:1.2}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.opt{border:0;border-radius:20px;padding:12px;font:700 2.6rem var(--arf);background:var(--card);color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.18);cursor:pointer}
.opt.ok{background:var(--green);color:#fff}.opt.no{background:var(--coral);color:#fff;animation:shake .3s}

.bar{height:14px;border-radius:9px;background:var(--soft);overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:var(--sun);transition:width .3s}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mc{aspect-ratio:1;border:0;border-radius:18px;background:var(--violet);color:#fff;font-size:2rem;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-family:var(--arf);line-height:1.1;padding:2px}
.mc.up{background:var(--card);color:var(--ink)}.mc.done{background:var(--green);color:#fff}

.s-vh{background:linear-gradient(#bfe6ff 55%,#6b7480 55%)}.s-fm{background:linear-gradient(#ffe6bf 62%,#f2c27a 62%)}
.mv{position:absolute;left:50%;top:38%;width:0;height:0;transform-style:preserve-3d}
.rot{position:absolute;width:140px;height:140px;left:-70px;top:-70px;transform-style:preserve-3d;animation:spin 6s linear infinite}
.ly{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:6.8rem;line-height:1;backface-visibility:visible}
.sh{position:absolute;left:50%;bottom:26px;width:110px;height:18px;margin-left:-55px;border-radius:50%;background:rgba(0,0,0,.22)}
.s-an .mv{animation:hop 1.1s ease-in-out infinite}.s-an .sh{animation:shd 1.1s ease-in-out infinite}
.s-bd .mv{animation:fly 3.2s ease-in-out infinite}.s-bd .rot{animation:sway 2.4s ease-in-out infinite alternate}

@keyframes sway{from{transform:rotateY(-45deg)}to{transform:rotateY(45deg)}}

/* ===== Enhanced Praise (3D spectacular) ===== */
.pr{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;pointer-events:none;perspective:800px;background:rgba(0,0,0,.15)}

@keyframes prIn{0%{transform:rotateX(90deg) scale(.2) translateZ(-200px);opacity:0}18%{transform:rotateX(-18deg) scale(1.15);opacity:1}35%{transform:rotateY(360deg) scale(1.05)}55%{transform:rotateY(360deg) scale(1)}80%{opacity:1;transform:translateY(-30px) scale(1)}100%{transform:translateY(-100px) scale(.85);opacity:0}}

.garden{position:relative;height:360px;perspective:1000px;border-radius:26px;overflow:hidden;background:linear-gradient(#9fdcff 0 40%,#79cf6a 40%);margin-top:8px;box-shadow:inset 0 -20px 40px rgba(0,80,0,.15)}

.cloud{position:absolute;font-size:3rem;left:-15%;top:10%;animation:cl 20s linear infinite;opacity:.9}.c2{top:22%;animation-delay:-10s}
@keyframes cl{to{left:105%}}@keyframes spin2{to{transform:rotate(360deg)}}
.tree{position:absolute;top:20%;font-size:4.2rem;margin-left:-30px;filter:drop-shadow(0 6px 4px rgba(0,0,0,.2))}
.an3{position:absolute;width:96px;height:96px;margin:0 0 0 -48px;padding:0;border:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:filter .2s}
.an3:active{filter:brightness(1.15)}
.r3{position:absolute;inset:0;transform-style:preserve-3d;animation:sway3 2.8s ease-in-out infinite alternate}
.r3 .ly{font-size:4.6rem;filter:drop-shadow(0 4px 3px rgba(0,0,0,.25))}
@keyframes sway3{from{transform:rotateY(-35deg) translateY(0)}to{transform:rotateY(35deg) translateY(-10px)}}
.an3.jump .r3{animation:jump3 1.5s cubic-bezier(.2,.8,.3,1) both}
@keyframes jump3{0%{transform:translateY(0) scale(1)}25%{transform:translateY(-120px) rotateY(180deg) scale(1.4)}50%{transform:translateY(-130px) rotateY(360deg) scale(1.45)}70%{transform:translateY(-40px) rotateY(360deg) scale(1.1)}100%{transform:translateY(0) rotateY(360deg) scale(1)}}
.an3.no{animation:shake .35s}
.flw{position:absolute;left:0;right:0;bottom:8px;display:flex;justify-content:center;gap:6px;font-size:2.2rem;flex-wrap:wrap}.flw span{animation:pop .5s;filter:drop-shadow(0 3px 2px rgba(0,0,0,.2))}
.toast{display:none;position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#12353a;color:#fff;border-radius:16px;padding:12px 16px;z-index:40;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.3);font-size:.95rem}
.voice-ok{color:#2fae62;font-weight:700}
.voice-warn{color:#ffc43d}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* particle burst */
.burst{position:fixed;pointer-events:none;z-index:45;font-size:1.6rem;animation:burstOut 1.1s ease-out forwards}
@keyframes burstOut{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--tx),var(--ty)) scale(.3);opacity:0}}

/* ===================== VOICE ENGINE (robust for Web + Android WebView + Capacitor + native bridge) ===================== */
function pickV() {
  try {
    const voices = speechSynthesis.getVoices() || [];
    // Prefer clear Arabic voices in order of quality
    const prefs = [
      v => /ar[-_]SA|Saudi/i.test(v.lang + v.name),
      v => /ar[-_]EG|Egypt/i.test(v.lang + v.name),
      v => /Google.*Arabic|Arabic.*Google/i.test(v.name),
      v => /Microsoft.*Arabic|Arabic.*Microsoft/i.test(v.name),
      v => /^ar([-_]|$)/i.test(v.lang),
      v => /arab/i.test(v.name)
    ];
    for (const test of prefs) {
      const found = voices.find(test);
      if (found) { VO = found; return voices.length; }
    }
    VO = null;
    return voices.length;
  } catch (e) { return 0; }
}

try {
  speechSynthesis.onvoiceschanged = pickV;
  pickV();
  setTimeout(pickV, 400);
  setTimeout(pickV, 1200);
  setTimeout(pickV, 3000);
} catch (e) {}

// Unlock audio / TTS on first user gesture (critical for mobile + WebView)
document.addEventListener('pointerdown', () => {
  try {
    const u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    speechSynthesis.speak(u);
    speechSynthesis.cancel();
  } catch (e) {}
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();

/* Audio queue for pre-recorded pack */
let AQ = [], ACUR = null;
function nextA() {
  const src = AQ.shift();
  if (!src) { ACUR = null; return; }
  const a = new Audio(src);
  ACUR = a;
  a.onended = a.onerror = nextA;
  a.play().catch(nextA);
}
function packPlay(t, queue) {
  const P = window.VOICE_PACK;
  if (!P || !P[t]) return false;
  if (!queue) {
    AQ = [];
    if (ACUR) { try { ACUR.pause(); } catch (e) {} ACUR = null; }
  }
  AQ.push(P[t]);
  if (!ACUR) nextA();
  return true;
}

function webSpeak(t, queue) {
  try {
    const s = window.speechSynthesis;
    if (!s) return false;
    if (!queue) s.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = VO ? VO.lang : 'ar-SA';
    if (VO) u.voice = VO;
    u.rate = 0.72;
    u.pitch = 1.05;
    u.volume = 1;
    try { s.resume(); } catch (e) {}
    s.speak(u);
    return true;
  } catch (e) { return false; }
}

/** Main speak function – works on:
 *  1. Pre-recorded VOICE_PACK (best for APK / offline)
 *  2. Android native bridge (window.AndroidTTS)
 *  3. Capacitor TextToSpeech plugin
 *  4. Web Speech API (Chrome / modern browsers)
 */
function say(t, queue = false) {
  if (!t) return;
  try {
    // 1. Pre-recorded pack (clearest + offline)
    if (packPlay(t, queue)) return;

    // 2. Android WebView native bridge (common in custom APKs)
    if (window.AndroidTTS && typeof AndroidTTS.speak === 'function') {
      AndroidTTS.speak(t, 'ar', !!queue);
      return;
    }

    // 3. Capacitor
    const cap = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.TextToSpeech;
    if (cap) {
      cap.speak({
        text: t,
        lang: 'ar-SA',
        rate: 0.8,
        pitch: 1.05,
        volume: 1.0,
        queueStrategy: queue ? 1 : 0
      }).catch(() => webSpeak(t, queue));
      return;
    }

    // 4. Audio files folder fallback
    if (window.USE_AUDIO_FILES) {
      const a = new Audio('audio/' + encodeURIComponent(t) + '.mp3');
      a.onerror = () => webSpeak(t, queue);
      a.play().catch(() => webSpeak(t, queue));
      return;
    }

    // 5. Web Speech API
    if (!webSpeak(t, queue)) {
      toast('ശബ്ദം ലഭ്യമല്ല. Chrome ഉപയോഗിക്കുക അല്ലെങ്കിൽ അറബി വോയ്സ് ഡാറ്റ ഡൗൺലോഡ് ചെയ്യുക.');
    }
  } catch (e) {
    console.warn('say error', e);
  }
}

/* ===================== SOUND FX ===================== */
function tone(f, d = .15, t = 0) {
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = f;
    o.type = 'triangle';
    g.gain.setValueAtTime(.18, AC.currentTime + t);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + t + d);
    o.connect(g); g.connect(AC.destination);
    o.start(AC.currentTime + t);
    o.stop(AC.currentTime + t + d + 0.05);
  } catch (e) {}
}
const good = () => { tone(660); tone(880, .22, .11); tone(1100, .18, .25); S++; $('#st').textContent = '⭐ ' + S; praise(); };
const bad = () => tone(160, .35);

function fx(n = 16) {
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.className = 'fx';
    s.textContent = ['⭐','🎉','✨','🌟','💫','🌸'][i % 6];
    s.style.left = Math.random() * 96 + 'vw';
    s.style.animationDelay = Math.random() * .6 + 's';
    s.style.fontSize = (1.4 + Math.random() * 1.2) + 'rem';
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 2600);
  }
}

function burst(x, y, n = 12) {
  const emojis = ['✨','⭐','🌟','💫','🎉','🌸'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span');
    s.className = 'burst';
    s.textContent = emojis[i % emojis.length];
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    const ang = (i / n) * Math.PI * 2 + Math.random() * .5;
    const dist = 60 + Math.random() * 90;
    s.style.setProperty('--tx', Math.cos(ang) * dist + 'px');
    s.style.setProperty('--ty', Math.sin(ang) * dist + 'px');
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1200);
  }
}

      <p>${st === 3 ? 'അടിപൊളി! 🎉 നിങ്ങൾ സൂപ്പർ!' : 'നന്നായി, ഒന്നുകൂടി കളിക്കാം 💪'}</p>
      <div class="row">
        <button class="btn g" onclick="go('${kind}')">🔁 വീണ്ടും</button>
        <button class="btn c" onclick="games()">🎮 കളികൾ</button>
      </div>
    </div>`);
  }
  let q, opts, ans, top;
  if (kind === 'quiz1') {
    q = ALL[Math.random() * ALL.length | 0];
    ans = q[0];
    opts = sh([ans, ...sh(ALL.filter(w => w[0] != ans)).slice(0, 3).map(w => w[0])]);
    top = `<div class="e">${q[1]}</div><b>${q[2]}</b><p>ഇതിന്റെ അറബി പദം ഏത്?</p>`;
  } else {
    q = L[Math.random() * 28 | 0];
    ans = q[3][0];
    opts = sh([ans, ...sh(L.map(l => l[0]).filter(c => c != ans)).slice(0, 3)]);
    top = `<div class="e">${q[4]}</div><b>${q[5]}</b><p>ഇതിന്റെ അറബി പദം ഏത് അക്ഷരത്തിൽ തുടങ്ങുന്നു?</p>`;
  }
  set(`<div class="bar"><i style="width:${n * 10}%"></i></div>
  <div class="q">${top}
    <div class="opts ar">${opts.map(o => `<button class="opt" onclick="pick(this,'${o}','${ans}','${kind}',${n},${sc})">${o}</button>`).join('')}</div>
  </div>`);
}
function pick(b, o, a, k, n, sc) {
  const ok = o == a;
  b.classList.add(ok ? 'ok' : 'no');
  if (ok) { good(); say(o, true); }
  else {
    bad();
    const correct = [...document.querySelectorAll('.opt')].find(x => x.textContent == a);
    if (correct) correct.classList.add('ok');
  }
  document.querySelectorAll('.opt').forEach(x => x.onclick = null);
  setTimeout(() => quiz(k, n + 1, sc + (ok ? 1 : 0)), 1100);
}
function quiz1() { quiz('quiz1'); }
function quiz2() { quiz('quiz2'); }

function memory() {
  const p = sh(ALL).slice(0, 6);
  const cs = sh(p.flatMap((w, i) => [{i, t: w[1], a: 0}, {i, t: w[0], a: 1}]));
  let first = null, lock = 0, done = 0;
  set(`<h2>ജോഡി കണ്ടെത്തൂ 🃏</h2>
  <p>ചിത്രവും അതിന്റെ അറബി പദവും ചേർത്തു വയ്ക്കൂ</p>
  <div class="mem">${cs.map((c, k) => `<button class="mc" data-k="${k}">❓</button>`).join('')}</div>`);
  document.querySelectorAll('.mc').forEach(b => b.onclick = () => {
    const c = cs[b.dataset.k];
    if (lock || b.classList.contains('up') || b.classList.contains('done')) return;
    b.classList.add('up');
    b.textContent = c.t;
    if (c.a) say(c.t);
    if (!first) { first = b; return; }
    const f = cs[first.dataset.k];
    if (f.i == c.i) {
      good();
      [first, b].forEach(x => { x.classList.remove('up'); x.classList.add('done'); });
      first = null;
      if (++done == 6) { fx(20); setTimeout(games, 2000); }
    } else {
      bad();
      lock = 1;
      const a = first;
      first = null;
      setTimeout(() => {
        [a, b].forEach(x => { x.classList.remove('up'); x.textContent = '❓'; });
        lock = 0;
      }, 850);
    }
  });
}

/* ===================== GARDEN – enhanced 3D game ===================== */
const FL = ['🌸','🌼','🌷','🌺','🌻','🌹','💐','🌱','🍀','🌿'];

function garden(n = 0, sc = 0) {
  const V = Object.values(W);
  if (n >= 8) {
    fx(28);
    say('ممتاز');
    return set(`<div class="q">
      <h2>🎉 തോട്ടം നിറഞ്ഞു!</h2>
      <div class="garden" style="height:280px">
        <div class="sun">☀️</div>
        <div class="cloud">🦋</div>
        <div class="cloud c2">🐝</div>
        ${[10,30,50,70,90].map((x,i) => `<span class="tree" style="left:${x}%;top:${18+(i%2)*12}%">🌳</span>`).join('')}
        <div class="flw" style="bottom:18px;font-size:2.8rem">${FL.map(f => `<span>${f}</span>`).join('')}</div>
      </div>
      <p>നിങ്ങൾ ഒരു അറബി തോട്ടക്കാരനായി! 🌟</p>
      <div class="row">
        <button class="btn g" onclick="go('garden')">🔁 വീണ്ടും</button>
        <button class="btn c" onclick="home()">🏠 ഹോം</button>
      </div>
    </div>`);
  }
  const pk = sh([...V[0], ...V[1]]).slice(0, 4);
  const t = pk[Math.random() * 4 | 0];
  set(`<div class="bar"><i style="width:${n * 12.5}%"></i></div>
  <div class="q">
    <div class="ar" style="font-size:3.8rem;color:var(--teal);line-height:1.25">${t[0]}</div>
    <b>${t[2]}</b>
    <button class="btn s" onclick="say('${t[0]}')" style="margin:6px">🔊 കേൾക്കൂ</button>
    <p style="margin:6px 0 2px">ശരിയായ മൃഗത്തെ / പക്ഷിയെ തൊടൂ 👇</p>
  </div>
  <div class="garden">
    <div class="sun">☀️</div>
    <div class="cloud">☁️</div>
    <div class="cloud c2">☁️</div>
    ${[8, 50, 90].map(x => `<span class="tree" style="left:${x}%">🌳</span>`).join('')}
    ${pk.map((a, i) => `<button class="an3" style="left:${12 + i * 25}%;top:${42 + (i % 2) * 16}%" aria-label="${a[3]}"
      onclick="gpick(this,'${a[0]}','${t[0]}',${n},${sc})">
      <span class="r3" style="animation-delay:-${i * .65}s">${lay(a[1], 9, 4)}</span>
    </button>`).join('')}
    <div class="flw">${FL.slice(0, n).map(f => `<span>${f}</span>`).join('')}</div>
  </div>`);
  setTimeout(() => say(t[0]), 320);
}

function gpick(b, a, t, n, sc) {
  if (b.dataset.d) return;
  if (a == t) {
    document.querySelectorAll('.an3').forEach(x => x.dataset.d = 1);
    b.classList.add('jump');
    good();
    say(t, true);
    // particle burst from the animal
    const r = b.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 14);
    setTimeout(() => garden(n + 1, sc + 1), 2100);
  } else {
    bad();
    b.classList.add('no');
    setTimeout(() => b.classList.remove('no'), 420);
    say('حاول مرة أخرى');
  }
}

/* Start */
home();
