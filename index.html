function set(h,back=true){app.innerHTML=h;$('#back').style.display=back?'':'none';window.scrollTo(0,0)}
function home(){closeM();set(`<div class="hero"><div class="big ar">ب ت ث</div><p>വരൂ, അറബി പഠിക്കാം! 🌙</p><button class="btn s" onclick="testV()">🔊 ശബ്ദം പരിശോധിക്കാം</button></div><div class="menu">
${[['🔤','അക്ഷരങ്ങൾ','ഉച്ചാരണം പഠിക്കാം','letters'],['✍️','എഴുതാം','വിരൽ കൊണ്ട് എഴുതാം','write'],['🔗','കൂട്ടക്ഷരം','ചേർത്ത് വായിക്കാം','join'],['🐘','പദങ്ങൾ','മൃഗം · പക്ഷി · വാഹനം · കുടുംബം','words'],['💬','സംഭാഷണം','ലളിതമായ സംസാരം','talk'],['🎮','കളികൾ','കളിച്ച് പഠിക്കാം','games']].map((m,i)=>`<button class="tile" style="--c:${col(i)}" onclick="go('${m[3]}')"><i>${m[0]}</i><b>${m[1]}</b><span>${m[2]}</span></button>`).join('')}</div>`,false)}
function go(v,a){closeM();({letters,write,join,words,talk,games,quiz1,quiz2,memory})[v](a)}
function closeM(){$('#modal').innerHTML=''}
function letters(){set(`<h2>അക്ഷരങ്ങൾ</h2><p>ഒരു അക്ഷരം തൊടൂ 👇</p><div class="grid">${L.map((l,i)=>`<button class="lt" style="--c:${col(i)}" onclick="showL(${i})">${l[0]}</button>`).join('')}</div>`)}
function showL(i){const l=L[i],c=l[0],F=[['ഒറ്റയ്ക്ക്',c],['തുടക്കം',c+'\u200D'],['നടുവിൽ','\u200D'+c+'\u200D'],['ഒടുവിൽ','\u200D'+c]];say(l[1]);
$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="panel" style="--c:${col(i)}"><div class="huge ar">${c}</div><h2 class="ar" style="margin:0">${l[1]}</h2><div>${l[2]}</div>
<div class="forms ar">${F.map(f=>`<div><b>${f[1]}</b><small style="font-family:inherit;direction:ltr;display:block">${f[0]}</small></div>`).join('')}</div>
<button class="card" style="width:100%" onclick="say('${l[3]}')"><span class="e">${l[4]}</span> <span class="a ar">${l[3]}</span><div class="m">${l[5]} · ${l[6]}</div></button>
<div class="row"><button class="btn s" onclick="say('${l[1]}')">🔊 അക്ഷരം</button><button class="btn v" onclick="say('${l[3]}')">🔊 പദം</button><button class="btn g" onclick="go('write',${i})">✍️ എഴുതാം</button><button class="btn c" onclick="closeM()">✖</button></div></div></div>`}
function write(i=0){const l=L[i];set(`<h2>എഴുതാം ✍️</h2><div class="pad"><div class="ghost ar">${l[0]}</div><canvas id="cv" width="340" height="340"></canvas></div>
<div class="row"><button class="btn c" onclick="write(${(i+27)%28})">⬅</button><button class="btn v" onclick="say('${l[1]}')">🔊 ${l[1]}</button><button class="btn s" onclick="write(${i})">🧽 മായ്ക്കുക</button><button class="btn g" onclick="good();fx();write(${(i+1)%28})">✔ ശരി</button><button class="btn c" onclick="write(${(i+1)%28})">➡</button></div><p style="text-align:center">മങ്ങിയ അക്ഷരത്തിന് മുകളിലൂടെ വിരൽ ഓടിക്കൂ</p>`);
const c=$('#cv'),x=c.getContext('2d');x.lineWidth=15;x.lineCap=x.lineJoin='round';x.strokeStyle='#ff6a55';let d=0;
const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*c.width/r.width,(e.clientY-r.top)*c.height/r.height]};
c.onpointerdown=e=>{d=1;c.setPointerCapture(e.pointerId);const q=p(e);x.beginPath();x.moveTo(...q);x.lineTo(q[0]+.1,q[1]);x.stroke()};
c.onpointermove=e=>{if(d){x.lineTo(...p(e));x.stroke()}};c.onpointerup=c.onpointercancel=()=>d=0}
function join(){set(`<h2>കൂട്ടക്ഷരം 🔗</h2><p>അക്ഷരങ്ങൾ ചേർത്ത് വായിക്കാം</p>${J.map((j,i)=>`<div class="jw" id="j${i}"><span class="e">${j[1]}</span><div class="body"><div class="split ar">${[...j[0]].join(' + ')}</div><div class="whole ar">${j[0]}</div><b>${j[2]}</b></div><div class="row" style="margin:0"><button class="btn c" onclick="$('#j${i}').classList.toggle('on');say('${j[0]}')">🔗 ചേർക്കുക</button><button class="btn s" onclick="say('${j[0]}')">🔊</button></div></div>`).join('')}`)}
function words(k=Object.keys(W)[0]){set(`<h2>പദങ്ങൾ</h2><div class="tabs">${Object.keys(W).map(n=>`<button class="tab ${n==k?'on':''}" onclick="words('${n}')">${n}</button>`).join('')}</div><div class="cards">${W[k].map((w,i)=>`<button class="card" onclick="v3('${k}',${i})"><div class="e idle-${KT[Object.keys(W).indexOf(k)]}">${w[1]}</div><div class="t">3D 👆</div><div class="a ar">${w[0]}</div><div class="m">${w[2]}</div><div class="t">${w[3]}</div></button>`).join('')}</div>`)}
function v3(k,i){const w=W[k][i],t=KT[Object.keys(W).indexOf(k)];say(w[0]);let ly='';for(let z=0;z<9;z++)ly+=`<span class="ly" style="transform:translateZ(${(z-4)*5}px);filter:brightness(${z==4?1:.5})">${w[1]}</span>`;
$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeM()"><div class="panel"><div class="scene s-${t}" id="sc"><div class="mv"><div class="rot" id="rot">${ly}</div></div><div class="sh"></div></div><p style="margin:4px">വിരൽ കൊണ്ട് തിരിക്കാം 👆</p><div class="a ar" style="font-size:3.2rem;color:var(--teal);line-height:1.3">${w[0]}</div><b>${w[2]}</b> · ${w[3]}<div class="row"><button class="btn v" onclick="say('${w[0]}')">🔊</button><button class="btn s" onclick="v3('${k}',${(i+1)%W[k].length})">അടുത്തത് ➡</button><button class="btn c" onclick="closeM()">✖</button></div></div></div>`;
const sc=$('#sc'),r=$('#rot');let x0=null,ry=0;sc.onpointerdown=e=>{x0=e.clientX;sc.setPointerCapture(e.pointerId);r.style.animation='none'};sc.onpointermove=e=>{if(x0!==null){ry+=(e.clientX-x0)*1.2;x0=e.clientX;r.style.transform=`rotateY(${ry}deg)`}};sc.onpointerup=sc.onpointercancel=()=>x0=null}
function talk(k=Object.keys(D)[0]){set(`<h2>സംഭാഷണം 💬</h2><div class="tabs">${Object.keys(D).map(n=>`<button class="tab ${n==k?'on':''}" onclick="talk('${n}')">${n}</button>`).join('')}</div><div class="chat">${D[k].map((s,i)=>`<button class="bub ${i%2?'B':'A'}" onclick="say('${s[0]}')"><span class="a ar">${s[0]}</span><span class="m">${s[1]}</span></button>`).join('')}</div><p style="text-align:center">ഓരോ വരിയും തൊട്ട് കേൾക്കൂ 🔊</p>`)}
function games(){set(`<h2>കളികൾ 🎮</h2><div class="menu">${[['🖼️','ചിത്രം കണ്ടെത്തൂ','ശരിയായ അറബി പദം','quiz1'],['🔠','ആദ്യ അക്ഷരം','ഏത് അക്ഷരത്തിൽ തുടങ്ങും?','quiz2'],['🃏','ജോഡി കണ്ടെത്തൂ','ചിത്രവും പദവും','memory']].map((m,i)=>`<button class="tile" style="--c:${col(i+1)}" onclick="go('${m[3]}')"><i>${m[0]}</i><b>${m[1]}</b><span>${m[2]}</span></button>`).join('')}</div>`)}
let G;
function quiz(kind,n=0,sc=0){if(n>=10){const st=sc>=9?3:sc>=6?2:1;fx();return set(`<div class="q"><div class="e">${'⭐'.repeat(st)}</div><h2>${sc} / 10 ശരി!</h2><p>${st==3?'അടിപൊളി! 🎉':'നന്നായി, ഒന്നുകൂടി കളിക്കാം 💪'}</p><div class="row"><button class="btn g" onclick="go('${kind}')">🔁 വീണ്ടും</button><button class="btn c" onclick="games()">🎮 കളികൾ</button></div></div>`)}
let q,opts,ans,top;
if(kind=='quiz1'){q=ALL[Math.random()*ALL.length|0];ans=q[0];opts=sh([ans,...sh(ALL.filter(w=>w[0]!=ans)).slice(0,3).map(w=>w[0])]);top=`<div class="e">${q[1]}</div><b>${q[2]}</b><p>ഇതിന്റെ അറബി പദം ഏത്?</p>`}
else{q=L[Math.random()*28|0];ans=q[3][0];opts=sh([ans,...sh(L.map(l=>l[0]).filter(c=>c!=ans)).slice(0,3)]);top=`<div class="e">${q[4]}</div><b>${q[5]}</b><p>ഇതിന്റെ അറബി പദം ഏത് അക്ഷരത്തിൽ തുടങ്ങുന്നു?</p>`}
G={sc};set(`<div class="bar"><i style="width:${n*10}%"></i></div><div class="q">${top}<div class="opts ar">${opts.map(o=>`<button class="opt" onclick="pick(this,'${o}','${ans}','${kind}',${n},${sc})">${o}</button>`).join('')}</div></div>`);}
function pick(b,o,a,k,n,sc){const ok=o==a;b.classList.add(ok?'ok':'no');if(ok){good();say(o)}else{bad();[...document.querySelectorAll('.opt')].find(x=>x.textContent==a).classList.add('ok')}
document.querySelectorAll('.opt').forEach(x=>x.onclick=null);setTimeout(()=>quiz(k,n+1,sc+(ok?1:0)),1000)}
function quiz1(){quiz('quiz1')}function quiz2(){quiz('quiz2')}
function memory(){const p=sh(ALL).slice(0,6);const cs=sh(p.flatMap((w,i)=>[{i,t:w[1],a:0},{i,t:w[0],a:1}]));let first=null,lock=0,done=0;
set(`<h2>ജോഡി കണ്ടെത്തൂ 🃏</h2><p>ചിത്രവും അതിന്റെ അറബി പദവും ചേർത്തു വയ്ക്കൂ</p><div class="mem">${cs.map((c,k)=>`<button class="mc" data-k="${k}">❓</button>`).join('')}</div>`);
document.querySelectorAll('.mc').forEach(b=>b.onclick=()=>{const c=cs[b.dataset.k];if(lock||b.classList.contains('up')||b.classList.contains('done'))return;b.classList.add('up');b.textContent=c.t;if(c.a)say(c.t);
if(!first){first=b;return}const f=cs[first.dataset.k];
if(f.i==c.i){good();[first,b].forEach(x=>{x.classList.remove('up');x.classList.add('done')});first=null;if(++done==6){fx();setTimeout(games,1800)}}
else{bad();lock=1;const a=first;first=null;setTimeout(()=>{[a,b].forEach(x=>{x.classList.remove('up');x.textContent='❓'});lock=0},800)}})}
home();
</script></body></html>
